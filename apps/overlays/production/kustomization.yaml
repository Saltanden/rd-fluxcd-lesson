apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - namespace.yaml
  - dragonfly.yaml
  - hpa.yaml
  - ../../base
patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: course-app
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: course-app-ingress
